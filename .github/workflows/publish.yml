# Publishes to the Comfy Registry on every version bump in pyproject.toml.
#
# Needs a repo secret REGISTRY_ACCESS_TOKEN — the Registry Publishing API key
# created under the publisher that owns [tool.comfy].PublisherId.
name: Publish to Comfy Registry

# The registry key is the only secret here, and the job below hands it to a
# third-party action, so this workflow gets no more of the repository than it
# needs: read the code, write nothing.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without the secret, comfy-cli is handed an empty --token and exits 2, so
      # every pyproject.toml edit before the publisher exists would show up as a
      # failed run on the repo. A red cross that means "not configured yet" is
      # indistinguishable from one that means "the publish broke", so decide here
      # and skip loudly instead. Secrets are unavailable in a job-level `if`,
      # which is why this reads the token through env in a step.
      - name: Check whether publishing is configured
        id: gate
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::REGISTRY_ACCESS_TOKEN is not set — nothing was published to the registry."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # @main on purpose, which is what that action's own README prescribes.
      # Its main (d2366e7, 2025-05-10) is 6 commits ahead of the newest release:
      # tags 1.0.0 and 1.0.1 both sit on 7578cdb from 2024-05-16, whose steps
      # accept comfy-cli tracking and then disable it, while main never enables
      # it. So the tag is the stale option here, not the safe one.
      #
      # Known trade-off: a moving reference receives the publishing key, so
      # whatever lands on that branch next runs here without review. Replace
      # @main with a full commit sha to stop that.
      - name: Publish node
        if: steps.gate.outputs.publish == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
