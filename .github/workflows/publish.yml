# Publishes to the Comfy Registry on every version bump in pyproject.toml.
#
# Needs a repo secret REGISTRY_ACCESS_TOKEN — the Registry Publishing API key
# created under the publisher that owns [tool.comfy].PublisherId.
name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
